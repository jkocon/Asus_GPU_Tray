[package]
name = "asus-gpu-tray"
version = "2.0.0-alpha.0"
edition = "2021"
rust-version = "1.82"
description = "System tray icon that shows which GPU is rendering and switches GPU modes (Rust rewrite)"
license = "GPL-3.0-or-later"
repository = "https://github.com/jkocon/Asus_GPU_Tray"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
