[package]
name = "asus-gpu-tray"
version = "2.0.0-alpha.0"
edition = "2021"
rust-version = "1.90"
description = "System tray icon that shows which GPU is rendering and switches GPU modes (Rust rewrite)"
license = "GPL-3.0-or-later"
repository = "https://github.com/jkocon/Asus_GPU_Tray"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
gettext-rs = "0.8.0"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
udev = "0.9.3"
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# Size over speed: the tray mostly waits for events. Most of what is left is slint, winit, text
# shaping and Unicode data.
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1
strip = true

