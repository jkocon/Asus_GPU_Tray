# Asus GPU Tray: drop-in for ~/.config/systemd/user/plasma-kwin_wayland.service.d/. Loads only
# Mesa's EGL in KWin, so the NVIDIA EGL driver never opens /dev/nvidia0 inside the compositor.
# asus-gpu-tray-kwin.sh writes the file at login, and leaves it out in MUX mode.
[Service]
EnvironmentFile=-%t/asus-gpu-tray-kwin.env
