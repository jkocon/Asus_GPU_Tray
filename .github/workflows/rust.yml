# fmt, clippy and tests on every change to the code. Builds nothing that gets published
# (release.yml does that for version tags).
name: rust

on:
  push:
    paths: ["src/**", "tests/**", "po/**", "icons/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "po/**", "icons/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev libfontconfig-dev libxkbcommon-dev
      # rustup is preinstalled on the runner; no third-party toolchain action needed.
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
